{{- if .Values.otelCollector.enabled }}
# A minimal OpenTelemetry Collector. It receives OTLP traces from the service and prints them (debug exporter).
# In a real platform the exporter would point at Tempo; the service side does not change.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-otel-collector
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http: { endpoint: 0.0.0.0:4318 }
    processors:
      batch: {}
    exporters:
      debug: { verbosity: detailed }
    service:
      pipelines:
        traces: { receivers: [otlp], processors: [batch], exporters: [debug] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-otel-collector
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: collector
          image: {{ .Values.otelCollector.image }}
          args: ["--config=/conf/config.yaml"]
          ports:
            - { containerPort: 4318 }
          volumeMounts:
            - { name: conf, mountPath: /conf }
      volumes:
        - name: conf
          configMap: { name: {{ .Release.Name }}-otel-collector }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-otel-collector
spec:
  selector: { app.kubernetes.io/name: otel-collector, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: otlp-http, port: 4318 }
{{- end }}
